name: Rename space.html to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy space.html to index.html and remove space.html
        run: |
          test -f space.html
          cp space.html index.html
          rm space.html
          git config user.name "TonyGolfstory"
          git config user.email "TonyGolfstory@users.noreply.github.com"
          git add index.html space.html
          git commit -m "Rename space.html to index.html"
          git push
